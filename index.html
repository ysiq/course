<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCT-100 过程控制实训课程</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
.header { background: linear-gradient(135deg, #0a1a0a 0%, #0d2610 100%); padding: 40px 60px; border-bottom: 1px solid #1a3a1a; }
.header h1 { font-size: 32px; color: #2ecc71; margin-bottom: 8px; }
.header p { color: #888; font-size: 15px; }
.container { max-width: 1000px; margin: 0 auto; padding: 40px 60px; }
.section-title { font-size: 20px; color: #2ecc71; margin-bottom: 20px; padding-left: 12px; border-left: 3px solid #2ecc71; }
.course-list { list-style: none; }
.course-item { background: #0d2810; border: 1px solid #1a3a1a; border-radius: 12px; margin-bottom: 16px; transition: all 0.2s; }
.course-item:hover { border-color: #2ecc71; transform: translateX(4px); }
.course-item a { display: block; padding: 20px 24px; text-decoration: none; color: inherit; }
.course-num { font-size: 13px; color: #2ecc71; font-weight: bold; }
.course-title { font-size: 18px; color: #fff; margin: 4px 0; }
.course-desc { font-size: 14px; color: #888; }
.course-status { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 10px; margin-top: 8px; }
.status-ready { background: #1b4332; color: #5f9; }
.footer { text-align: center; padding: 30px; color: #555; font-size: 13px; }
</style>
</head>
<body>
<div class="header">
  <h1>PCT-100 过程控制实训课程</h1>
  <p>化学工程与工艺专业 · 实训设备配套教程</p>
</div>
<div class="container">
  <div class="section-title">课程列表</div>
  <ul class="course-list">
    <li class="course-item">
      <a href="第9课时.html">
        <div class="course-num">第9课时</div>
        <div class="course-title">前端开发与 GitHub Pages 部署</div>
        <div class="course-desc">HTML / CSS / JavaScript 基础 · AI 生成代码 · GitHub Pages 上线</div>
        <span class="course-status status-ready">图文教程</span>
      </a>
    </li>
    <li class="course-item">
      <a href="第10课时.html">
        <div class="course-num">第10课时</div>
        <div class="course-title">Node.js 与 Electron 桌面应用开发</div>
        <div class="course-desc">Node.js / npm · Electron 架构 · exe 打包</div>
        <span class="course-status status-ready">图文教程</span>
      </a>
    </li>
  </ul>
</div>
<div class="footer">中国地质大学 · 过程控制实训设备 PCT-100</div>
</body>
</html>
